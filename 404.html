<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı | Uludoğan Panjur</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <style>
    .nf { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .nf-code { font-family: var(--font-display); font-weight: 800; font-size: clamp(5rem, 20vw, 10rem); line-height: 1; letter-spacing: -.05em; color: var(--accent); }
    .nf h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 12px 0 14px; }
    .nf p { color: var(--muted); max-width: 30em; margin: 0 auto 28px; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <div class="nf-code">404</div>
      <h1>Bu sayfa kapalı kaldı.</h1>
      <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya dönüp oradan devam edebilirsiniz.</p>
      <a class="btn btn-primary btn-lg" href="./">Ana sayfaya dön</a>
    </div>
  </main>
</body>
</html>
